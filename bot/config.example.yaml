# Copy to config.yaml (gitignored) or pass --config.
# Telegram secrets belong in the environment, never in this file:
#   export TELEGRAM_BOT_TOKEN="..."
#   export TELEGRAM_CHAT_ID="..."

# 20 mid-cap Binance USD-M USDT perpetuals (24h quote-volume ranks ~15–60,
# excluding BTC, ETH, top majors and stablecoins). Refresh as the book changes.
symbols:
  - AKEUSDT
  - ASTERUSDT
  - ENAUSDT
  - JCTUSDT
  - HUMAUSDT
  - UNIUSDT
  - SPACEUSDT
  - AAVEUSDT
  - WLDUSDT
  - XMRUSDT
  - SKRUSDT
  - INJUSDT
  - PAXGUSDT
  - SOPHUSDT
  - BULLAUSDT
  - BTWUSDT
  - PUMPUSDT
  - ARIAUSDT
  - TAOUSDT
  - INITUSDT

timeframes:
  - 5m
  - 15m

# low | medium | high  (same thresholds as the v7 chart)
sensitivity: medium

# Telegram-style alerts for faded BUY?/SELL? developing pivots.
# Unconfirmed paper trading and alerts_unconfirmed.jsonl run regardless.
provisional_alerts: false

# 0 = only the symbols list. If > 0, also watch the top N USD-M perpetual USDT pairs by 24h quote volume.
top_n_by_volume: 0

state_file: state.json
chart_url: https://dedkovic441-hub.github.io/adx-swing/

# REST polling interval (also used as a backup while the WebSocket is live)
poll_interval_sec: 15
