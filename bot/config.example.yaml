# Copy to config.yaml (gitignored) or pass --config.
# Telegram secrets belong in the environment, never in this file:
#   export TELEGRAM_BOT_TOKEN="..."
#   export TELEGRAM_CHAT_ID="..."

# 30 mid-cap Binance USD-M USDT perpetuals (24h quote-volume ranks ~15–60,
# excluding BTC, ETH, top majors and stablecoins). Refresh as the book changes.
symbols:
  - AKEUSDT
  - ASTERUSDT
  - ENAUSDT
  - JCTUSDT
  - HUMAUSDT
  - UNIUSDT
  - SPACEUSDT
  - AAVEUSDT
  - WLDUSDT
  - XMRUSDT
  - SKRUSDT
  - INJUSDT
  - PAXGUSDT
  - SOPHUSDT
  - BULLAUSDT
  - BTWUSDT
  - PUMPUSDT
  - ARIAUSDT
  - TAOUSDT
  - INITUSDT
  - RAREUSDT
  - LITUSDT
  - SUIUSDT
  - AIOTUSDT
  - CROSSUSDT
  - ICPUSDT
  - KAVAUSDT
  - JUPUSDT
  - ZROUSDT
  - PIEVERSEUSDT

timeframes:
  - 5m
  - 15m

# low | medium | high  (same thresholds as the v7 chart)
sensitivity: medium

# Telegram-style alerts for faded BUY?/SELL? developing pivots.
# Unconfirmed paper trading and alerts_unconfirmed.jsonl run regardless.
provisional_alerts: false

# 0 = only the symbols list. If > 0, also watch the top N USD-M perpetual USDT pairs by 24h quote volume.
top_n_by_volume: 0

state_file: state.json
chart_url: https://dedkovic441-hub.github.io/zigzag-swing/

# REST polling interval (also used as a backup while the WebSocket is live)
poll_interval_sec: 15

# Paper accounts trade only this timeframe, with one open position per coin.
# Signals on other timeframes are still alerted and logged, but do not trade.
# Compounding: margin per new position is 5% of realized balance, notional is
# margin x leverage. An open trade closes at +take_profit_usd net (after 0.05%
# taker fees on both sides), on an opposite-direction signal, or on isolated
# liquidation, whichever happens first. After any close, that coin cannot open
# a new position for cooldown_minutes (including a flip). A take-profit or
# liquidation just closes; it does not flip.
paper:
  active_timeframe: 15m
  take_profit_usd: 2
  leverage: 3
  cooldown_minutes: 3

# Unconfirmed paper account: a faded BUY?/SELL? keeps the position open.
# A later same-direction unconfirmed signal can add another leg sized to
# the first leg's notional. max_add_positions is additional legs (4 → 5 total).
# Timeframes in dca_every_signal_timeframes count same-direction unconfirmed
# signals while the position is open (the entry is not counted) and add a
# leg on every dca_signal_every-th signal (3rd, 6th, 9th, 12th), with no
# fade required. Other timeframes still need a fade first.
unconfirmed:
  max_add_positions: 4
  dca_signal_every: 3
  dca_every_signal_timeframes:
    - 15m
