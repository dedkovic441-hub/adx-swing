# Copy to config.yaml (gitignored) or pass --config.
# Telegram secrets belong in the environment, never in this file:
#   export TELEGRAM_BOT_TOKEN="..."
#   export TELEGRAM_CHAT_ID="..."

# 20 mid-cap Binance USD-M USDT perpetuals (24h quote-volume ranks ~15–60,
# excluding BTC, ETH, top majors and stablecoins). Refresh as the book changes.
symbols:
  - AKEUSDT
  - ASTERUSDT
  - ENAUSDT
  - JCTUSDT
  - HUMAUSDT
  - UNIUSDT
  - SPACEUSDT
  - AAVEUSDT
  - WLDUSDT
  - XMRUSDT
  - SKRUSDT
  - INJUSDT
  - PAXGUSDT
  - SOPHUSDT
  - BULLAUSDT
  - BTWUSDT
  - PUMPUSDT
  - ARIAUSDT
  - TAOUSDT
  - INITUSDT

timeframes:
  - 5m
  - 15m

# low | medium | high  (same thresholds as the v7 chart)
sensitivity: medium

# Telegram-style alerts for faded BUY?/SELL? developing pivots.
# Unconfirmed paper trading and alerts_unconfirmed.jsonl run regardless.
provisional_alerts: false

# 0 = only the symbols list. If > 0, also watch the top N USD-M perpetual USDT pairs by 24h quote volume.
top_n_by_volume: 0

state_file: state.json
chart_url: https://dedkovic441-hub.github.io/zigzag-swing/

# REST polling interval (also used as a backup while the WebSocket is live)
poll_interval_sec: 15

# Paper accounts trade only this timeframe, with one open position per coin.
# Signals on other timeframes are still alerted and logged, but do not trade.
# An opposite-direction signal on this timeframe closes the open trade and flips.
# Positions are not closed on fade, timeout, stop, or take-profit.
paper:
  active_timeframe: 15m

# Unconfirmed paper account: a faded BUY?/SELL? keeps the position open.
# A later same-direction unconfirmed signal adds another leg sized to the
# first leg's notional. max_add_positions is additional legs (4 → 5 total).
# Timeframes in dca_every_signal_timeframes add a leg on every new
# same-direction unconfirmed signal (including a pivot walk), with no fade
# required. Other timeframes still need a fade first.
unconfirmed:
  max_add_positions: 4
  dca_every_signal_timeframes:
    - 15m
